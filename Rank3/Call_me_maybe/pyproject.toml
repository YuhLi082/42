[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling for a small local LLM via constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ['^\.venv/', '^llm_sdk/']

# llm_sdk is the provided package, not our code: do not lint it.
[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
